name: ${APP_NAME:-laravertex}

services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
      - "${VITE_PORT:-5173}:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    command: bash -c "php artisan serve --host=0.0.0.0 --port=8000 & npm run dev -- --host"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - .:/var/www/html
    command: php artisan horizon
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - .:/var/www/html
    command: php artisan schedule:work
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: laravertex_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - laravertex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "laravertex_db", "-U", "root"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - laravertex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  laravertex_postgres:
    driver: local
  laravertex_redis:
    driver: local
