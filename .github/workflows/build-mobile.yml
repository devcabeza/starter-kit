name: Build Mobile App

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_PACKAGE_NAME: com.laravertex.app
  APP_NAME: Laravertex

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=$ANDROID_PACKAGE_NAME" > .env
          echo "CAPACITOR_APP_NAME=$APP_NAME" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ secrets.PRODUCTION_URL }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ secrets.PRODUCTION_URL }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Capacitor
        run: |
          npm install @capacitor/android
          npx cap add android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate mobile icons
        run: ./scripts/generate-mobile-icons.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          echo "Building version $VERSION (code ${{ github.run_number }})"

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android AAB (for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          draft: false
          prerelease: false
          make_latest: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=com.laravertex.app" > .env
          echo "CAPACITOR_APP_NAME=$APP_NAME" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ secrets.PRODUCTION_URL }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ secrets.PRODUCTION_URL }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Setup Capacitor
        run: |
          npm install @capacitor/ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath $PWD/build/App.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportOptionsPlist $PWD/exportOptions.plist \
                     -exportPath $PWD/build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: ios/App/build/App.ipa
          retention-days: 30
