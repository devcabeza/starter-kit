name: Build Mobile App

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment to build'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE_NAME: com.laravertex.app
  APP_NAME: Laravertex

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve target environment
        id: env-config
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_TARGET: ${{ inputs.target_env }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$INPUT_TARGET"
          elif [ "$GIT_REF" = "refs/heads/staging" ]; then
            TARGET="staging"
          else
            TARGET="production"
          fi

          if [ "$TARGET" = "staging" ]; then
            SERVER_URL="$STAGING_URL"
            APP_ID="com.laravertex.app.canary"
            APP_NAME="Laravertex Canary"
            APK_NAME="laravertex-canary.apk"
            AAB_NAME="laravertex-canary.aab"
          else
            SERVER_URL="$PRODUCTION_URL"
            APP_ID="com.laravertex.app"
            APP_NAME="Laravertex"
            APK_NAME="laravertex.apk"
            AAB_NAME="laravertex.aab"
          fi

          if [ -z "$SERVER_URL" ]; then
            if [ "$TARGET" = "staging" ]; then
              echo "::error::STAGING_URL is not set. A canary build must never point at production."
            else
              echo "::error::PRODUCTION_URL is not set."
            fi
            exit 1
          fi

          {
            echo "target_env=$TARGET"
            echo "server_url=$SERVER_URL"
            echo "app_id=$APP_ID"
            echo "app_name=$APP_NAME"
            echo "apk_filename=$APK_NAME"
            echo "aab_filename=$AAB_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Target: $TARGET ($APP_ID) -> $SERVER_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=${{ steps.env-config.outputs.app_id }}" > .env
          echo "CAPACITOR_APP_NAME=${{ steps.env-config.outputs.app_name }}" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ steps.env-config.outputs.server_url }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ steps.env-config.outputs.server_url }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ steps.env-config.outputs.server_url }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Capacitor
        run: |
          npm install @capacitor/android
          npx cap add android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate mobile icons
        run: ./scripts/generate-mobile-icons.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android Version
        env:
          TARGET_ENV: ${{ steps.env-config.outputs.target_env }}
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "staging" ]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
            if [ "$TARGET_ENV" = "staging" ]; then
              VERSION="${VERSION}-canary"
            fi
          fi

          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          echo "Building version $VERSION (code ${GITHUB_RUN_NUMBER}) for $TARGET_ENV"

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android AAB (for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleDebug

      - name: Prepare build artifacts
        env:
          APK_NAME: ${{ steps.env-config.outputs.apk_filename }}
          AAB_NAME: ${{ steps.env-config.outputs.aab_filename }}
        run: |
          set -euo pipefail

          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$APK_NAME"
          cp android/app/build/outputs/bundle/debug/app-debug.aab "android/app/build/outputs/bundle/debug/$AAB_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.env-config.outputs.target_env }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/${{ steps.env-config.outputs.apk_filename }}
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ steps.env-config.outputs.target_env }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/debug/${{ steps.env-config.outputs.aab_filename }}
          retention-days: 30

      - name: Upload binaries to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Cloudflare R2 rejects the CRC32 checksums newer AWS CLI versions add by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_PRODUCTION: ${{ secrets.R2_BUCKET_PRODUCTION }}
          R2_BUCKET_STAGING: ${{ secrets.R2_BUCKET_STAGING }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TARGET_ENV: ${{ steps.env-config.outputs.target_env }}
          APK_PATH: android/app/build/outputs/apk/debug/${{ steps.env-config.outputs.apk_filename }}
          AAB_PATH: android/app/build/outputs/bundle/debug/${{ steps.env-config.outputs.aab_filename }}
          APK_NAME: ${{ steps.env-config.outputs.apk_filename }}
          AAB_NAME: ${{ steps.env-config.outputs.aab_filename }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::R2 credentials are not configured (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY). Skipping upload."
            exit 0
          fi

          # Tolerate a pasted URL or domain instead of a bare account ID.
          ACCOUNT_ID=$(printf '%s' "$R2_ACCOUNT_ID" | sed -e 's|^https\?://||' -e 's|\.r2\.cloudflarestorage\.com.*$||' -e 's|/.*$||' | xargs)
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"

          if [ "$TARGET_ENV" = "staging" ]; then
            BUCKET="${R2_BUCKET_STAGING:-${R2_BUCKET_PRODUCTION:-}}"
          else
            BUCKET="${R2_BUCKET_PRODUCTION:-}"
          fi
          BUCKET=$(printf '%s' "$BUCKET" | sed -e 's|^https\?://||' -e 's|/.*$||' | xargs)

          if [ -z "$BUCKET" ]; then
            echo "::error::No R2 bucket configured for '$TARGET_ENV'. Set R2_BUCKET_STAGING and R2_BUCKET_PRODUCTION."
            exit 1
          fi

          # Path-style addressing is mandatory for R2.
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4

          upload() {
            aws s3 cp "$1" "s3://${BUCKET}/$2" \
              --endpoint-url "$ENDPOINT" \
              --region auto \
              --content-type "$3" \
              --cache-control "public, max-age=300" \
              --no-progress
          }

          echo "Uploading $TARGET_ENV binaries to R2 bucket '$BUCKET'..."
          upload "$APK_PATH" "$APK_NAME" "application/vnd.android.package-archive"
          upload "$AAB_PATH" "$AAB_NAME" "application/octet-stream"

          if [ "$IS_TAG" = "true" ]; then
            echo "Tagged release detected ($VERSION_TAG), uploading versioned copies..."
            upload "$APK_PATH" "laravertex-${VERSION_TAG}.apk" "application/vnd.android.package-archive"
            upload "$AAB_PATH" "laravertex-${VERSION_TAG}.aab" "application/octet-stream"
          fi

          echo "Upload to Cloudflare R2 finished."

          if [ -n "${R2_PUBLIC_URL:-}" ]; then
            BASE="${R2_PUBLIC_URL%/}"
            {
              echo "### Android binaries published ($TARGET_ENV)"
              echo ""
              echo "- APK: ${BASE}/${APK_NAME}"
              echo "- AAB: ${BASE}/${AAB_NAME}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=$ANDROID_PACKAGE_NAME" > .env
          echo "CAPACITOR_APP_NAME=$APP_NAME" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ secrets.PRODUCTION_URL }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ secrets.PRODUCTION_URL }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Setup Capacitor
        run: |
          npm install @capacitor/ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath $PWD/build/App.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportOptionsPlist $PWD/exportOptions.plist \
                     -exportPath $PWD/build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: ios/App/build/App.ipa
          retention-days: 30
