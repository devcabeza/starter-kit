name: Build Mobile App

on:
  pull_request:
    branches:
      - main
    type:
      - closed
  workflow_dispatch:

env:
  ANDROID_PACKAGE_NAME: laravertex
  APP_NAME: Laravertex

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=$ANDROID_PACKAGE_NAME" > .env
          echo "CAPACITOR_APP_NAME=$APP_NAME" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ secrets.PRODUCTION_URL }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ secrets.PRODUCTION_URL }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Capacitor
        run: |
          npm install @capacitor/android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build Android AAB (for Play Store)
        working-directory: android
        run: |
          ./gradlew bundleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          retention-days: 30

      - name: Upload to GitHub Releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for Capacitor
        run: |
          echo "CAPACITOR_APP_ID=com.laravertex.app" > .env
          echo "CAPACITOR_APP_NAME=$APP_NAME" >> .env
          echo "CAPACITOR_WEB_DIR=dist" >> .env
          echo "CAPACITOR_SERVER_URL=${{ secrets.PRODUCTION_URL }}" >> .env
          echo "CAPACITOR_SERVER_CLEARTEXT=false" >> .env
          echo "CAPACITOR_ANDROID_SCHEME=https" >> .env
          echo "FRONTEND_URL=${{ secrets.PRODUCTION_URL }}" >> .env

      - name: Build web assets
        run: npm run build
        env:
          VITE_APP_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Setup Capacitor
        run: |
          npm install @capacitor/ios
          npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath $PWD/build/App.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportOptionsPlist $PWD/exportOptions.plist \
                     -exportPath $PWD/build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.sha }}
          path: ios/App/build/App.ipa
          retention-days: 30
